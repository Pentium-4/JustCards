html/custom_html_shell=""
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-title\" content=\"Just Cards\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\">
<script>
// Ограничиваем чёткость рендера до 2x. На айфоне экран 3x, и рендер в полном
// разрешении расходует в 2,25 раза больше видеопамяти — разницы на глаз почти нет.
(function () {
  var realRatio = window.devicePixelRatio || 1;
  try {
    Object.defineProperty(window, \"devicePixelRatio\", { get: function () { return Math.min(realRatio, 2); } });
  } catch (e) {}
})();
</script>"
